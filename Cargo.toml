[package]
name = "xml_watcher"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
notify = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
sha2 = "0.10"
hex = "0.4"
percent-encoding = "2"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
async-trait = "0.1"
futures-util = "0.3"
dotenvy = "0.15.7"
walkdir = "2.5.0"
lapin = "4.10.0"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-postgres = "0.7.18"
hmac = "0.13"
[profile.release]
panic = "unwind"

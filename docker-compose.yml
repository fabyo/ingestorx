
services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio_ingestorx
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export MINIO_ROOT_PASSWORD="$$(cat /run/secrets/minio_secret_key)"
        exec minio server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-ingestorx}
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - minio_data:/data
    secrets:
      - minio_secret_key
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: always

  postgres:
    image: postgres:16.4-alpine
    container_name: postgres_ingestorx
    environment:
      POSTGRES_DB: ingestorx
      POSTGRES_USER: ingestorx
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingestorx -d ingestorx"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: always

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_ingestorx
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        password="$$(cat /run/secrets/rabbitmq_password)"
        rm -rf /tmp/rabbitmq-tls
        mkdir -m 700 /tmp/rabbitmq-tls
        cp /run/secrets/rabbitmq_ca /tmp/rabbitmq-tls/ca.pem
        cp /run/secrets/rabbitmq_server_cert /tmp/rabbitmq-tls/server.pem
        cp /run/secrets/rabbitmq_server_key /tmp/rabbitmq-tls/server-key.pem
        chown -R rabbitmq:rabbitmq /tmp/rabbitmq-tls
        chmod 600 /tmp/rabbitmq-tls/*
        rm -f /tmp/rabbitmq.conf
        cp /etc/rabbitmq/rabbitmq-base.conf /tmp/rabbitmq.conf
        printf '\ndefault_user = %s\ndefault_pass = %s\n' "$${INGESTORX_RABBITMQ_USER}" "$${password}" >> /tmp/rabbitmq.conf
        chown rabbitmq:rabbitmq /tmp/rabbitmq.conf
        chmod 600 /tmp/rabbitmq.conf
        export RABBITMQ_CONFIG_FILE=/tmp/rabbitmq
        exec /usr/local/bin/docker-entrypoint.sh rabbitmq-server
    ports:
      - "127.0.0.1:5673:5671"
      - "127.0.0.1:15673:15671"
    environment:
      INGESTORX_RABBITMQ_USER: ${RABBITMQ_USER:?execute just setup}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq.conf:/etc/rabbitmq/rabbitmq-base.conf:ro
    secrets:
      - rabbitmq_password
      - rabbitmq_ca
      - rabbitmq_server_cert
      - rabbitmq_server_key
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: always

  loki:
    image: grafana/loki:2.9.0
    container_name: loki_ingestorx
    ports:
      - "127.0.0.1:3101:3100"
    volumes:
      - ./docker/loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    restart: always

  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail_ingestorx
    volumes:
      - ./dados/logs:/var/log/ingestorx
      - ./docker/promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: always

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus_ingestorx
    network_mode: host
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.listen-address=127.0.0.1:19090
    restart: always

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager_ingestorx
    network_mode: host
    volumes:
      - ./docker/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --web.listen-address=127.0.0.1:9093
    restart: always

  grafana:
    image: grafana/grafana:10.1.5
    container_name: grafana_ingestorx
    user: "0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export GF_SECURITY_ADMIN_PASSWORD="$$(cat /run/secrets/grafana_admin_password)"
        exec su grafana -s /bin/sh -c 'exec /run.sh'
    ports:
      - "127.0.0.1:13000:3000"
    volumes:
      - ./docker/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./docker/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./docker/dashboards:/var/lib/grafana/dashboards
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - grafana_admin_password
    depends_on:
      - loki
      - prometheus
    restart: always

volumes:
  rabbitmq_data:
  prometheus_data:
  postgres_data:
  minio_data:

secrets:
  rabbitmq_password:
    file: ./secrets/rabbitmq_password
  rabbitmq_ca:
    file: ./docker/certs/ca.pem
  rabbitmq_server_cert:
    file: ./docker/certs/server.pem
  rabbitmq_server_key:
    file: ./secrets/rabbitmq_server_key
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  postgres_password:
    file: ./secrets/postgres_password
  minio_secret_key:
    file: ./secrets/minio_secret_key

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ingestorx-watcher
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:9898"]

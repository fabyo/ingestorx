listeners.tcp = none
listeners.ssl.default = 5671

ssl_options.cacertfile = /tmp/rabbitmq-tls/ca.pem
ssl_options.certfile = /tmp/rabbitmq-tls/server.pem
ssl_options.keyfile = /tmp/rabbitmq-tls/server-key.pem
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2

management.ssl.port = 15671
management.ssl.cacertfile = /tmp/rabbitmq-tls/ca.pem
management.ssl.certfile = /tmp/rabbitmq-tls/server.pem
management.ssl.keyfile = /tmp/rabbitmq-tls/server-key.pem

loopback_users.guest = false
